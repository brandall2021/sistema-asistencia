services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asistencia
      POSTGRES_PASSWORD: asistencia
      POSTGRES_DB: asistencia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistencia"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://asistencia:asistencia@postgres:5432/asistencia
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-please-use-a-long-random-value}
      QR_TOKEN_TTL_SECONDS: ${QR_TOKEN_TTL_SECONDS:-45}
      GPS_MAX_ACCURACY: ${GPS_MAX_ACCURACY:-25}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://asistencia.local}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@universidad.edu}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Administrador del Sistema}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CERT_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
