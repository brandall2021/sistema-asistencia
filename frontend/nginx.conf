server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # PWA / SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API + WebSocket (los upgrades se aplican también a /ws dentro de /api/)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Service worker: no-cache, but allow navigation
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        proxy_cache_bypass $http_pragma;
        try_files /ngsw-worker.js =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files /manifest.webmanifest =404;
    }

    # Static assets cache
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
