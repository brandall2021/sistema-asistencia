# Servidor para la imagen única (Frontend + Backend en un solo contenedor).
# TLS/HTTPS lo resuelve el proxy inverso de Dokploy, por eso solo HTTP:80.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PWA / SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck del backend (endpoint directo de FastAPI)
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API + WebSocket (uvicorn local, mismo contenedor)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Service worker: no-cache
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        try_files /ngsw-worker.js =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files /manifest.webmanifest =404;
    }

    # Static assets cache
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
